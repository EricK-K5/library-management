server:
    port: 8080
    servlet:
        context-path: /api

spring:
    datasource:
        url: "jdbc:mysql://localhost:3306/library_management"
        username: root
        password: "${DB_PASSWORD}"
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

    ai:
        google:
            genai:
                api-key: ${GEMINI_API_KEY}
                chat:
                    model: gemini-3.5-flash-lite
        chat:
            memory:
                repository:
                    jdbc:
                        initialize-schema: always


    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 6MB

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${EMAIL_USERNAME}
        password: ${EMAIL_PASSWORD}
        default-encoding: UTF-8
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

jwt:
    access-key: ${JWT_ACCESS_KEY}
    refresh-key: ${JWT_REFRESH_KEY}
    access-duration: 900 #15 min
    refresh-duration: 604800 #7 day
    cookie:
        #        Gửi qua HTTP only
        secure: false
        #        Chỉ gửi cookie tới cùng domain
        same-site: Strict
        #        Chỉ gửi tới api/auth
        path: /api/auth

app:
    mail:
        enabled: ${MAIL_ENABLED:true}
        from: ${EMAIL_USERNAME}

    upload:
        dir: uploads

    cors:
        allowed-origins: http://localhost:3000,http://localhost:5173

    vnpay:
        enabled: ${VNPAY_ENABLED:true}
        pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
        tmn-code: ${VNPAY_TMN_CODE:}
        hash-secret: ${VNPAY_HASH_SECRET:}
        # Return URL la redirect cua trinh duyet -> localhost la du, khong can ngrok
        return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/vnpay/return}
        # Trang FE hien ket qua sau khi BE xu ly xong
        frontend-result-url: ${VNPAY_FRONTEND_RESULT_URL:http://localhost:5173/fines/payment-result}
        version: "2.1.0"
        command: pay
        order-type: other

